# ============================================================================
# РУЧНАЯ СБОРКА ПРОИЗВОЛЬНОГО РЕГИОНА
#
# Запуск: вкладка Actions → «build-map (manual region)» → Run workflow.
# Результат: файл <region>_gmapsupp.img в Artifacts страницы запуска
# (хранится 30 дней; поменять — retention-days в _build-region.yml).
#
# Дефолты полей ниже — маленький тестовый регион (~4 мин); подставьте свои.
# Вся логика сборки — в _build-region.yml, здесь только форма запуска.
# ============================================================================
name: build-map (manual region)

on:
  workflow_dispatch:
    inputs:
      region_name:
        description: "Имя региона (латиницей — станет именем файла)"
        required: true
        default: "chernyakhovsk"
      region_query:
        description: "Регион по названию, напр. 'Суздальский район' (Nominatim, реальная граница). Пусто = весь geofabrik-экстракт. ВАЖНО: непустой default тут нельзя — GitHub подставляет default вместо пустого ввода"
        required: false
        default: ""
      bbox:
        description: "ИЛИ прямоугольник: west,south,east,north"
        required: false
        default: ""
      boundary_geojson:
        description: "ИЛИ путь в репо к GeoJSON из webgui/index.html"
        required: false
        default: ""
      geofabrik:
        description: "Экстракт OSM: ключ из config/geofabrik_sources.yaml или URL"
        required: true
        default: "kaliningrad"
      contour_step:
        description: "Шаг горизонталей, м"
        required: false
        default: "10"
      include_cadastre:
        description: "Кадастровый слой: 1 = да, 0 = нет"
        required: false
        default: "0"
      cadastre_geojson:
        description: "Путь в репо к готовой выгрузке участков (QGIS)"
        required: false
        default: ""
      java_xmx:
        description: "Память JVM (для целых фед. округов ставьте 10g)"
        required: false
        default: "6g"

jobs:
  build:
    uses: ./.github/workflows/_build-region.yml
    secrets: inherit          # пробрасывает CADASTRE_PROXY, если секрет создан
    with:
      region_name: ${{ inputs.region_name }}
      region_query: ${{ inputs.region_query }}
      bbox: ${{ inputs.bbox }}
      boundary_geojson: ${{ inputs.boundary_geojson }}
      geofabrik: ${{ inputs.geofabrik }}
      contour_step: ${{ inputs.contour_step }}
      include_cadastre: ${{ inputs.include_cadastre }}
      cadastre_geojson: ${{ inputs.cadastre_geojson }}
      java_xmx: ${{ inputs.java_xmx }}
