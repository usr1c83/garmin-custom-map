# ============================================================================
# ПЕРЕИСПОЛЬЗУЕМАЯ СБОРКА ОДНОГО РЕГИОНА (вызывается из build-map.yml и
# release-scheduled.yml, напрямую не запускается).
#
# Что здесь можно менять:
#   * java_xmx (default)  — память JVM для splitter/mkgmap;
#   * timeout-minutes     — предел времени job (макс. 360 у GitHub);
#   * retention-days      — сколько хранить артефакт ручной сборки;
#   * WITH_BOUNDS         — "0", если адресный поиск не нужен (быстрее);
#   * MAX_IMG_MB/MAX_TRIES — порог size-guard (см. Build map ниже).
# ============================================================================
name: build-region (reusable)

on:
  workflow_call:
    inputs:
      region_name:
        description: "слуг региона — станет именем файла <region>_gmapsupp.img"
        required: true
        type: string
      region_query:
        description: "запрос в Nominatim (реальная админ-граница); пусто = весь geofabrik-экстракт"
        required: false
        type: string
        default: ""
      bbox:
        description: "west,south,east,north — прямоугольник вместо region_query"
        required: false
        type: string
        default: ""
      boundary_geojson:
        description: "путь в репозитории к GeoJSON из webgui (вместо region_query/bbox)"
        required: false
        type: string
        default: ""
      geofabrik:
        description: "ключ из config/geofabrik_sources.yaml или полный URL экстракта"
        required: true
        type: string
      contour_step:
        description: "шаг горизонталей, м (size-guard может автоматически увеличить)"
        required: false
        type: string
        default: "10"
      include_cadastre:
        description: "1 = собирать кадастровый слой (источники см. run_all.sh)"
        required: false
        type: string
        default: "0"
      cadastre_geojson:
        description: "путь в репозитории к готовой выгрузке участков"
        required: false
        type: string
        default: ""
      java_xmx:
        description: "куча JVM; для целых фед. округов ставится 10g"
        required: false
        type: string
        default: "6g"
    secrets:
      CADASTRE_PROXY:
        description: "HTTP(S)-прокси с российским IP для прямой выгрузки с НСПД"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # почти максимум GitHub (360)
    steps:
      - uses: actions/checkout@v6

      # На раннере ~14 ГБ свободно — для больших экстрактов (ЦФО ~4 ГБ pbf +
      # тайлы + рельеф) выкидываем предустановленный софт, получаем ещё ~20 ГБ
      - name: Free disk space (large regions)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc || true
          df -h / | tail -1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain (osmium, pyhgtmap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet pyhgtmap
          osmium --version | head -1
          pyhgtmap --version

      # Кешируются: mkgmap/splitter/bounds (tools/) и SRTM-тайлы (hgt/).
      # Ключ включает регион — у каждого региона свой набор тайлов рельефа.
      - name: Cache mkgmap/splitter and SRTM tiles
        uses: actions/cache@v5
        with:
          path: |
            tools
            hgt
          key: toolchain-hgt-${{ inputs.geofabrik }}-${{ hashFiles('scripts/common.sh') }}
          restore-keys: |
            toolchain-hgt-${{ inputs.geofabrik }}-
            toolchain-hgt-

      # build_with_size_guard.sh = run_all.sh + контроль размера: если
      # итоговый img больше MAX_IMG_MB (1950 МиБ, чуть ниже лимита GitHub
      # в 2 GiB на файл релиза), шаг горизонталей увеличивается на 5 м и
      # слой пересобирается — до MAX_TRIES раз. Пороги можно переопределить
      # здесь через env: MAX_IMG_MB / MAX_TRIES.
      - name: Build map
        env:
          REGION_NAME: ${{ inputs.region_name }}
          REGION_QUERY: ${{ inputs.region_query }}
          BBOX: ${{ inputs.bbox }}
          BOUNDARY_GEOJSON: ${{ inputs.boundary_geojson }}
          GEOFABRIK: ${{ inputs.geofabrik }}
          CONTOUR_STEP: ${{ inputs.contour_step }}
          INCLUDE_CADASTRE: ${{ inputs.include_cadastre }}
          CADASTRE_GEOJSON: ${{ inputs.cadastre_geojson }}
          CADASTRE_PROXY: ${{ secrets.CADASTRE_PROXY }}
          JAVA_XMX: ${{ inputs.java_xmx }}
          # предвычисленные границы НП (~400 МБ, кешируются) — без них
          # адресный поиск на приборе хуже привязывает улицы к городам
          WITH_BOUNDS: "1"
        run: ./scripts/build_with_size_guard.sh

      # Один файл либо несколько частей .partN.img, если регион не влез в
      # лимит релиза 2 GiB (см. size-guard) — копируются все
      - name: Collect result
        run: |
          mkdir -p dist
          cp out/"${{ inputs.region_name }}"/"${{ inputs.region_name }}"_gmapsupp*.img dist/ 2>/dev/null || true
          rm -f dist/gmapsupp.img
          ls -lh dist/
          test -n "$(ls dist/*.img 2>/dev/null)" || { echo "::error::no img produced"; exit 1; }
          for f in dist/*.img; do
            echo "### $(basename "$f"): $(numfmt --to=iec-i --suffix=B "$(stat -c%s "$f")")" >> "$GITHUB_STEP_SUMMARY"
          done

      # Артефакт подхватывает release-scheduled (job release) либо скачивается
      # вручную со страницы запуска (ручная сборка build-map)
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.region_name }}-gmapsupp
          path: dist/*.img
          if-no-files-found: error
          retention-days: 30
