# ============================================================================
# ПЛАНОВЫЕ РЕЛИЗЫ КАРТ ПО ФЕДЕРАЛЬНЫМ ОКРУГАМ
#
# Два способа запуска:
#   * автоматически по cron (строка ниже) — собираются ВСЕ регионы из
#     config/release_regions.yaml и публикуются одним релизом maps-ГГГГ-ММ-ДД;
#   * вручную: Actions → «release-scheduled» → Run workflow. Пустое поле
#     only = все регионы (как по cron); для теста можно ограничить:
#     only = kaliningrad,crimean-fd.
#
# ЕСЛИ КАКОЙ-ТО РЕГИОН УПАЛ: релиз всё равно публикуется из собранного, а
# недостающие регионы АВТОМАТИЧЕСКИ пересобираются и дозаливаются в тот же
# релиз (job autocomplete, до MAX попыток). Доделать вручную можно тем же
# workflow: only=<упавшие регионы через запятую>, tag=<тег того релиза>.
#
# Что здесь можно менять:
#   * расписание — строка cron (сейчас 1-е число каждого второго месяца,
#     03:00 UTC: январь, март, май, июль, сентябрь, ноябрь — интервал
#     не больше 62 дней);
#   * список регионов/шаг горизонталей/кадастр — НЕ здесь, а в
#     config/release_regions.yaml;
#   * java_xmx — память JVM для сборки больших округов.
#
# ВАЖНО (особенности GitHub):
#   * cron работает только если этот файл лежит в ветке по умолчанию;
#   * в форках scheduled-workflow надо включить вручную (Actions → Enable);
#   * GitHub отключает cron после 60 дней БЕЗ АКТИВНОСТИ в репозитории
#     (частота самого cron это не лечит!) — от этого защищает
#     keepalive.yml, который ежемесячно сбрасывает таймер через API.
# ============================================================================
name: release-scheduled (federal districts)

on:
  schedule:
    - cron: "0 3 1 */2 *"     # ← расписание: мин час день месяц день-недели
  workflow_dispatch:
    inputs:
      only:
        description: "собрать только эти регионы (имена через запятую; пусто = все)"
        required: false
        default: ""
      tag:
        description: "тег релиза (пусто = maps-ГГГГ-ММ-ДД)"
        required: false
        default: ""
      retry_round:
        description: "СЛУЖЕБНОЕ: счётчик авто-доделок упавших регионов (не трогать — ставится автоматически)"
        required: false
        default: "0"

# один релизный прогон за раз; новый не отменяет идущий
# (авто-доделка ждёт завершения текущего прогона, а не отменяет его)
concurrency:
  group: release-scheduled
  cancel-in-progress: false

jobs:
  # --- 1. читаем config/release_regions.yaml и строим матрицу регионов ---
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: mk
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 scripts/yaml_get.py json config/release_regions.yaml regions > all.json
          if [ -n "$ONLY" ]; then
            jq -c --arg only "$ONLY" \
              '[ .[] | select(.name as $n | ($only | split(",") | map(gsub("^ +| +$";"")) | index($n)) != null) ]' \
              all.json > sel.json
          else
            cp all.json sel.json
          fi
          test "$(jq length sel.json)" -gt 0 || { echo "::error::no regions matched '$ONLY'"; exit 1; }
          jq . sel.json
          echo "matrix={\"region\":$(jq -c . sel.json)}" >> "$GITHUB_OUTPUT"

  # --- 2. параллельная сборка каждого региона (общая логика в _build-region) ---
  build:
    needs: plan
    strategy:
      fail-fast: false          # упавший регион не отменяет остальные
      max-parallel: 1           # регионы собираются ПО ОЧЕРЕДИ, а не все сразу —
                                # чтобы не долбить Geofabrik параллельными
                                # скачиваниями (риск бана/троттлинга по IP).
                                # Ускорить = поднять число (напр. 3); упавший
                                # регион всё равно не блокирует следующие.
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_build-region.yml
    secrets: inherit            # CADASTRE_PROXY, если секрет создан
    with:
      region_name: ${{ matrix.region.name }}
      region_query: ${{ matrix.region.query }}
      geofabrik: ${{ matrix.region.geofabrik }}
      contour_step: ${{ format('{0}', matrix.region.contour_step) }}
      include_cadastre: ${{ matrix.region.cadastre && '1' || '0' }}
      cadastre_geojson: ${{ matrix.region.cadastre_geojson || '' }}
      java_xmx: "10g"

  # --- 3. публикация: все собранные .img одним релизом ---
  release:
    needs: build
    # публикуем даже при частичных сбоях: needs.build.result будет 'failure',
    # если упал хоть один регион из матрицы, поэтому проверяем не его, а
    # фактическое наличие артефактов (шаг Create release)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write           # право создавать релизы (токен по умолчанию)
    outputs:
      tag: ${{ steps.rel.outputs.tag }}   # фактический тег → для авто-доделки
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-gmapsupp"
          path: dist
          merge-multiple: true
      - name: Create release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${TAG_INPUT:-maps-$(date -u +%F)}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"   # запоминаем тег для доделки
          ls -lh dist/ || true
          test -n "$(ls dist/*.img 2>/dev/null)" || { echo "::error::ни один регион не собрался — публиковать нечего"; exit 1; }
          NOTES="Автосборка карт Garmin (топооснова OpenTopoMap + горизонтали + кадастр).
          Слои включаются на устройстве независимо: Setup → Map → Map Information.
          Установка: скопировать <регион>_gmapsupp.img в папку Garmin/ на карте памяти.
          Данные: © OpenStreetMap contributors (Geofabrik), viewfinderpanoramas.org.
          Стиль: OpenTopoMap (CC-BY-NC-SA 4.0, некоммерческое использование)."
          gh release create "$TAG" dist/*.img \
            --title "Garmin maps $TAG" \
            --notes "$NOTES" || \
          gh release upload "$TAG" dist/*.img --clobber

      # Чистка старых релизов — ТОЛЬКО если собрались ВСЕ регионы.
      # needs.build.result == 'success' (при fail-fast:false) означает, что
      # ни один job матрицы не упал. Если хоть один регион не собрался,
      # релиз всё равно публикуется из того, что вышло, но старые релизы
      # НЕ удаляем — чтобы не потерять полную карту прошлого раза из-за
      # неполной новой. Трогаются только теги maps-* (cadastre-data и прочие
      # служебные не затрагиваются). Сколько последних хранить — KEEP.
      - name: Prune old map releases
        if: ${{ needs.build.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=2
          gh release list --limit 100 --json tagName,createdAt \
            --jq "[ .[] | select(.tagName | startswith(\"maps-\")) ]
                  | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "deleting old release $tag"
            gh release delete "$tag" --yes --cleanup-tag || echo "::warning::failed to delete $tag"
          done
          gh release list

      # Сборка была неполной — сообщаем в лог, что старые релизы сохранены.
      - name: Skip prune (partial build)
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "::warning::собрались не все регионы (build result=${{ needs.build.result }}) — старые релизы НЕ удаляются, чтобы не потерять полную карту прошлого раза"

  # --- 4. авто-ДОДЕЛКА: если релиз вышел неполным (какой-то регион упал),
  # автоматически пересобираем ТОЛЬКО недостающие регионы и до-заливаем их в
  # ТОТ ЖЕ релиз (gh release upload --clobber). Реализовано пере-запуском
  # этого же workflow с only=<недостающие> tag=<тот же>; счётчик retry_round
  # ограничивает число авто-попыток (MAX ниже), чтобы не зациклиться.
  # Вручную доделать можно так же: Actions → release-scheduled → Run workflow,
  # only=<регионы через запятую>, tag=<тег неполного релиза>.
  autocomplete:
    needs: [build, release]
    # запускаемся, только если релиз опубликован (есть что дозаливать), но
    # собрались не все регионы; при полном успехе — ничего не делаем
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write            # право перезапустить workflow (workflow_dispatch)
    steps:
      - uses: actions/checkout@v6
      - name: Re-dispatch missing regions into the same release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ROUND: ${{ inputs.retry_round }}
          REF: ${{ github.ref_name }}
        run: |
          MAX=2                       # не больше 2 авто-доделок подряд
          ROUND="${ROUND:-0}"
          # какие регионы ждём и какие уже лежат в релизе (по префиксу имени файла)
          python3 scripts/yaml_get.py json config/release_regions.yaml regions > all.json
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt || true
          missing=$(jq -r '.[].name' all.json | while read -r n; do
            grep -q "^${n}_gmapsupp" assets.txt || echo "$n"
          done | paste -sd, -)
          if [ -z "$missing" ]; then
            echo "релиз $TAG уже полный — доделывать нечего"; exit 0
          fi
          echo "в релизе $TAG не хватает регионов: $missing"
          if [ "$ROUND" -ge "$MAX" ]; then
            echo "::warning::достигнут предел авто-доделок ($MAX). Доделайте вручную: release-scheduled → only=$missing, tag=$TAG"
            exit 0
          fi
          NEXT=$((ROUND + 1))
          echo "::notice::авто-доделка раунд $NEXT: пересобираю $missing → релиз $TAG"
          gh workflow run release-scheduled.yml --ref "$REF" \
            -f only="$missing" -f tag="$TAG" -f retry_round="$NEXT"
