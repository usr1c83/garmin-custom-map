# Регионы для плановых релизов (.github/workflows/release-scheduled.yml).
# Каждая запись становится job'ом матрицы; готовые .img публикуются одним
# GitHub Release с тегом maps-YYYY-MM-DD.
#
# Поля:
#   name        слуг региона (имя файла карты)
#   query       запрос в Nominatim для реальной границы (пусто = весь экстракт)
#   geofabrik   ключ из config/geofabrik_sources.yaml или полный URL
#   contour_step шаг горизонталей, м
#   cadastre    true/false — собирать ли кадастровый слой. Включено по
#                умолчанию; источник данных ищется в таком порядке:
#                1) cadastre_geojson из этого файла;
#                2) автоматически cadastre/<name>.geojson, если файл есть;
#                3) прямая выгрузка с НСПД (работает только через секрет
#                   CADASTRE_PROXY — ПКК геоблокирована вне РФ).
#                Если источника нет, слой просто пропускается (сборка
#                не падает) — см. cadastre/README.md.
#   cadastre_geojson  (опционально) явный путь в репо к готовой выгрузке
regions:
  - name: kaliningrad
    query: "Калининградская область"
    geofabrik: kaliningrad
    contour_step: 10
    cadastre: true
  - name: central-fd
    query: ""
    geofabrik: central-fd
    contour_step: 20
    cadastre: true
  - name: northwestern-fd
