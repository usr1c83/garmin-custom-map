    cadastre: true
  - name: north-caucasus-fd
    query: ""
    geofabrik: north-caucasus-fd
    contour_step: 20
    cadastre: true
  - name: volga-fd
    query: ""
    geofabrik: volga-fd
    contour_step: 20
    cadastre: true
  - name: ural-fd
    query: ""
    geofabrik: ural-fd
    contour_step: 20
    cadastre: true
  - name: siberian-fd
    query: ""
    geofabrik: siberian-fd
